<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>कुटुंबाचे स्वागत आणि आशीर्वाद</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-deep:#5A1620;
    --maroon:#7A1F2B;
    --marigold:#E6A431;
    --marigold-soft:#F3C96B;
    --ivory:#FBF3E3;
    --ink:#2A1410;
    --rose:#C9705F;
    --line: rgba(251,243,227,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Noto Sans Devanagari', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(230,164,49,0.16), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(230,164,49,0.12), transparent 45%),
      linear-gradient(180deg, var(--maroon-deep), var(--maroon) 60%, #4A1119);
    color:var(--ivory);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:24px 16px;
  }
  .stage{
    width:100%;
    max-width:460px;
    text-align:center;
    position:relative;
  }
  .kum{
    font-size:11px;
    letter-spacing:0.16em;
    color:var(--marigold-soft);
    opacity:0.85;
    margin-bottom:6px;
  }
  h1.brand{
    font-family:'Tiro Devanagari Marathi', serif;
    font-weight:400;
    font-style:normal;
    font-size:clamp(26px,7vw,34px);
    line-height:1.25;
    margin:0 0 4px;
    color:var(--ivory);
  }
  .brand em{
    font-style:italic;
    color:var(--marigold);
  }
  .sub{
    font-size:15px;
    color:var(--ivory);
    opacity:0.75;
    margin:0 0 28px;
  }
  /* --- intro screen --- */
  .card{
    background:rgba(251,243,227,0.06);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 22px;
    backdrop-filter: blur(6px);
  }
  label.field-label{
    display:block;
    font-size:14px;
    color:var(--marigold-soft);
    margin-bottom:8px;
    text-align:left;
  }
  input#familyName{
    width:100%;
    font-family:'Noto Sans Devanagari', sans-serif;
    font-size:18px;
    padding:13px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(0,0,0,0.18);
    color:var(--ivory);
    outline:none;
    text-align:center;
  }
  input#familyName:focus{border-color:var(--marigold);}
  .hint{
    font-size:12.5px;
    color:var(--ivory);
    opacity:0.55;
    margin-top:10px;
  }
  button.primary{
    margin-top:20px;
    width:100%;
    border:none;
    border-radius:999px;
    padding:15px 20px;
    font-family:'Noto Sans Devanagari', sans-serif;
    font-size:17px;
    font-weight:600;
    color:var(--ink);
    background:linear-gradient(180deg, var(--marigold-soft), var(--marigold));
    cursor:pointer;
    box-shadow:0 8px 22px rgba(230,164,49,0.28);
  }
  button.primary:active{transform:translateY(1px);}
  button.ghost{
    margin-top:12px;
    width:100%;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ivory);
    border-radius:999px;
    padding:12px 18px;
    font-family:'Noto Sans Devanagari', sans-serif;
    font-size:15px;
    cursor:pointer;
  }
  /* --- camera screen --- */
  .frame-wrap{
    position:relative;
    width:min(320px, 80vw);
    aspect-ratio:3/4;
    margin:0 auto 22px;
    border-radius:50% / 40%;
    overflow:hidden;
    border:3px solid var(--marigold);
    box-shadow:0 0 0 8px rgba(230,164,49,0.12), 0 20px 40px rgba(0,0,0,0.35);
  }
  video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    display:block;
    background:#1a0a0d;
  }
  .ring-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  .status-pill{
    display:inline-block;
    font-size:13px;
    padding:7px 16px;
    border-radius:999px;
    background:rgba(0,0,0,0.28);
    border:1px solid var(--line);
    color:var(--marigold-soft);
    margin-bottom:14px;
    min-height:16px;
  }
  .instruction{
    font-family:'Tiro Devanagari Marathi', serif;
    font-size:clamp(19px,5.5vw,23px);
    margin:6px 0 4px;
    color:var(--ivory);
  }
  .sub-small{
    font-size:13.5px;
    color:var(--ivory);
    opacity:0.65;
    margin-bottom:18px;
  }
  /* --- blessing screen --- */
  .diya{
    font-size:40px;
    margin-bottom:10px;
    filter: drop-shadow(0 4px 10px rgba(230,164,49,0.4));
  }
  .blessing-text{
    font-family:'Tiro Devanagari Marathi', serif;
    font-size:clamp(23px,6.5vw,29px);
    line-height:1.55;
    color:var(--ivory);
    margin:10px 0 26px;
  }
  .footer-note{
    margin-top:34px;
    font-size:11.5px;
    color:var(--ivory);
    opacity:0.4;
    letter-spacing:0.04em;
  }
  .screen{display:none;}
  .screen.active{display:block;}
  .fade-in{animation:fadeIn 0.5s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .marigold-burst{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:5;
  }
  .petal{
    position:absolute;
    top:-5%;
    font-size:18px;
    animation-name:fall;
    animation-timing-function:ease-in;
    animation-fill-mode:forwards;
    opacity:0.9;
  }
  @keyframes fall{
    to{ transform:translateY(112vh) rotate(300deg); opacity:0.2; }
  }
  .error-box{
    font-size:13.5px;
    background:rgba(0,0,0,0.25);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    margin-top:14px;
    color:var(--marigold-soft);
    text-align:left;
    display:none;
  }
  @media (prefers-reduced-motion: reduce){
    .fade-in{animation:none;}
    .petal{animation:none; display:none;}
  }
</style>
</head>
<body>

<div class="stage">

  <!-- INTRO -->
  <section id="screen-intro" class="screen active fade-in">
    <div class="kum">आशीर्वाद</div>
    <h1 class="brand">कुटुंब <em>स्वागत व आशीर्वाद</em></h1>
    <p class="sub">कॅमेऱ्यासमोर हात जोडा आणि आशीर्वाद स्वीकारा</p>
    <div class="card">
      <label class="field-label" for="familyName">कुटुंबाचे नाव लिहा</label>
      <input id="familyName" type="text" placeholder="उदा. पवार" maxlength="30" autocomplete="off">
      <div class="hint">हे नाव स्वागत संदेशात वापरले जाईल</div>
      <button class="primary" id="btnStart">सुरू करा</button>
      <div class="error-box" id="camError"></div>
    </div>
    <div class="footer-note">कॅमेरा व आवाज वापरण्याची परवानगी द्यावी लागेल</div>
  </section>

  <!-- WELCOME + DETECT -->
  <section id="screen-detect" class="screen">
    <div class="status-pill" id="statusPill">स्वागत आहे</div>
    <div class="frame-wrap">
      <video id="video" playsinline autoplay muted></video>
      <svg class="ring-svg" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(251,243,227,0.15)" stroke-width="3"/>
        <circle id="progressRing" cx="50" cy="50" r="46" fill="none" stroke="#E6A431" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289"
          transform="rotate(-90 50 50)"/>
      </svg>
    </div>
    <div class="instruction" id="instructionText">हात जोडा 🙏</div>
    <div class="sub-small" id="subSmall">दोन्ही हात कॅमेऱ्यासमोर ३ सेकंद जोडून ठेवा</div>
  </section>

  <!-- BLESSING -->
  <section id="screen-blessing" class="screen">
    <div class="diya">🪔</div>
    <div class="blessing-text" id="blessingText">…</div>
    <button class="primary" id="btnAgain">पुढील व्यक्तीसाठी</button>
    <button class="ghost" id="btnChangeName">कुटुंबाचे नाव बदला</button>
    <div class="footer-note" id="familyFooter"></div>
  </section>

</div>

<div class="marigold-burst" id="burst"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
(function(){
  "use strict";

  // ---------- Marathi content ----------
  const BLESSINGS = [
    "देवाने तुम्हाला सुख, आरोग्य आणि समृद्धी द्यावी. तुमच्या आयुष्यात सदैव आनंद राहो.",
    "तुमच्या घरात सदैव लक्ष्मीचा वास राहो, सुख-समृद्धी नांदो आणि सर्वांचे भले होवो.",
    "परमेश्वर तुमच्यावर कायम कृपा करो. तुमचे कुटुंब सुखी, समाधानी आणि निरोगी राहो.",
    "तुम्हाला दीर्घायुष्य आणि उत्तम आरोग्य लाभो. प्रत्येक क्षण आनंदाने भरून जावो.",
    "तुमच्या स्वप्नांना पंख मिळोत आणि यशाची वाट सदैव मोकळी होवो.",
    "तुमच्या आयुष्यातील प्रत्येक दिवस मंगलमय आणि सुखकारक ठरो."
  ];

  const els = {
    intro: document.getElementById('screen-intro'),
    detect: document.getElementById('screen-detect'),
    blessing: document.getElementById('screen-blessing'),
    familyInput: document.getElementById('familyName'),
    btnStart: document.getElementById('btnStart'),
    btnAgain: document.getElementById('btnAgain'),
    btnChangeName: document.getElementById('btnChangeName'),
    video: document.getElementById('video'),
    statusPill: document.getElementById('statusPill'),
    instructionText: document.getElementById('instructionText'),
    subSmall: document.getElementById('subSmall'),
    progressRing: document.getElementById('progressRing'),
    blessingText: document.getElementById('blessingText'),
    familyFooter: document.getElementById('familyFooter'),
    camError: document.getElementById('camError'),
    burst: document.getElementById('burst'),
  };

  const RING_CIRCUMFERENCE = 289;
  const HOLD_MS = 3000;
  const GRACE_MS = 350; // brief break allowed without resetting timer

  let familyName = "पवार";
  let stream = null;
  let handsModel = null;
  let rafId = null;
  let running = false;

  let holdStartTs = null;
  let lastGoodTs = null;
  let blessed = false;

  // ---------- Speech (sweet Marathi voice) ----------
  let voicesCache = [];
  function loadVoices(){
    voicesCache = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }
  if (window.speechSynthesis) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(){
    if(!voicesCache.length) return null;
    let v = voicesCache.find(v => v.lang && v.lang.toLowerCase() === 'mr-in');
    if(!v) v = voicesCache.find(v => v.lang && v.lang.toLowerCase().startsWith('mr'));
    if(!v) v = voicesCache.find(v => /female/i.test(v.name) && v.lang && v.lang.toLowerCase().startsWith('hi'));
    if(!v) v = voicesCache.find(v => v.lang && v.lang.toLowerCase().startsWith('hi'));
    return v || null;
  }
  function speak(text){
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'hi-IN'; }
    u.rate = 0.88;
    u.pitch = 1.12;
    u.volume = 1;
    window.speechSynthesis.speak(u);
  }

  // ---------- Screen switching ----------
  function showScreen(name){
    [els.intro, els.detect, els.blessing].forEach(s => s.classList.remove('active','fade-in'));
    const map = {intro: els.intro, detect: els.detect, blessing: els.blessing};
    map[name].classList.add('active','fade-in');
  }

  // ---------- Camera + Hands setup ----------
  async function startCamera(){
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: {ideal:480}, height:{ideal:640} },
      audio: false
    });
    els.video.srcObject = stream;
    await els.video.play();
  }

  function setupHandsModel(){
    handsModel = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
    });
    handsModel.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });
    handsModel.onResults(onResults);
  }

  function dist(a,b){
    const dx=a.x-b.x, dy=a.y-b.y;
    return Math.sqrt(dx*dx+dy*dy);
  }

  function handednessJoined(results){
    const lm = results.multiHandLandmarks;
    if(!lm || lm.length < 2) return false;
    const h1 = lm[0], h2 = lm[1];
    // wrist proximity
    const wristDist = dist(h1[0], h2[0]);
    // fingertip proximity (index + middle tips)
    const tipDist = (dist(h1[8],h2[8]) + dist(h1[12],h2[12])) / 2;
    // hands roughly at similar height (not one raised way above other)
    const heightDiff = Math.abs(h1[9].y - h2[9].y);
    return wristDist < 0.16 && tipDist < 0.14 && heightDiff < 0.15;
  }

  function onResults(results){
    if(!running || blessed) return;
    const now = performance.now();
    const joined = handednessJoined(results);

    if(joined){
      lastGoodTs = now;
      if(holdStartTs === null) holdStartTs = now;
      const elapsed = now - holdStartTs;
      updateRing(elapsed);
      updateStatus(true, elapsed);
      if(elapsed >= HOLD_MS){
        triggerBlessing();
      }
    } else {
      if(holdStartTs !== null && lastGoodTs !== null && (now - lastGoodTs) < GRACE_MS){
        // within grace period, keep holding progress visually
        updateRing(now - holdStartTs);
      } else {
        holdStartTs = null;
        lastGoodTs = null;
        updateRing(0);
      }
      updateStatus(false, 0);
    }
  }

  function updateRing(elapsedMs){
    const frac = Math.min(elapsedMs / HOLD_MS, 1);
    const offset = RING_CIRCUMFERENCE * (1 - frac);
    els.progressRing.setAttribute('stroke-dashoffset', offset.toFixed(1));
  }

  function updateStatus(joined, elapsedMs){
    if(joined){
      const secLeft = Math.max(0, Math.ceil((HOLD_MS - elapsedMs)/1000));
      els.statusPill.textContent = secLeft > 0 ? `हात जोडलेले आहेत... ${secLeft}` : 'आशीर्वाद देत आहे...';
      els.instructionText.textContent = 'असेच हात जोडून ठेवा 🙏';
    } else {
      els.statusPill.textContent = 'वाट पाहत आहे';
      els.instructionText.textContent = 'हात जोडा 🙏';
    }
  }

  let videoFrameLoopRunning = false;
  async function frameLoop(){
    if(!running) return;
    if(handsModel && els.video.readyState >= 2){
      await handsModel.send({image: els.video});
    }
    rafId = requestAnimationFrame(frameLoop);
  }

  // ---------- Blessing trigger ----------
  function triggerBlessing(){
    blessed = true;
    running = false;
    cancelAnimationFrame(rafId);
    const text = BLESSINGS[Math.floor(Math.random()*BLESSINGS.length)];
    els.blessingText.textContent = text;
    els.familyFooter.textContent = `${familyName} कुटुंब 🙏`;
    showScreen('blessing');
    launchPetals();
    speak(text);
  }

  function launchPetals(){
    els.burst.innerHTML = '';
    const emojis = ['🌼','🪔','✨','🌸'];
    for(let i=0;i<24;i++){
      const s = document.createElement('div');
      s.className = 'petal';
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = Math.random()*100 + 'vw';
      s.style.animationDuration = (3 + Math.random()*2.5) + 's';
      s.style.animationDelay = (Math.random()*0.8) + 's';
      s.style.fontSize = (14 + Math.random()*16) + 'px';
      els.burst.appendChild(s);
    }
    setTimeout(()=>{ els.burst.innerHTML=''; }, 6000);
  }

  // ---------- Flow control ----------
  async function beginSession(){
    els.camError.style.display = 'none';
    const nameVal = els.familyInput.value.trim();
    familyName = nameVal || 'पवार';

    try{
      await startCamera();
    }catch(err){
      els.camError.style.display = 'block';
      els.camError.textContent = 'कॅमेरा सुरू करता आला नाही. कृपया कॅमेरा वापरण्याची परवानगी द्या आणि पुन्हा प्रयत्न करा. (' + (err.message||err) + ')';
      return;
    }

    if(!handsModel) setupHandsModel();

    blessed = false;
    holdStartTs = null;
    lastGoodTs = null;
    updateRing(0);

    showScreen('detect');
    els.statusPill.textContent = 'स्वागत आहे';
    els.instructionText.textContent = 'हात जोडा 🙏';

    const welcomeMsg = `${familyName} कुटुंबात आपले सहर्ष स्वागत आहे!`;
    speak(welcomeMsg);

    running = true;
    frameLoop();
  }

  function stopCamera(){
    if(stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  els.btnStart.addEventListener('click', beginSession);

  els.familyInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') beginSession();
  });

  els.btnAgain.addEventListener('click', () => {
    beginSession();
  });

  els.btnChangeName.addEventListener('click', () => {
    running = false;
    cancelAnimationFrame(rafId);
    stopCamera();
    showScreen('intro');
  });

})();
</script>
</body>
</html>
